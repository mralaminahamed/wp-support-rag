<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="WP Support RAG">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#233468"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
  </defs>

  <!-- Badge background -->
  <rect width="32" height="32" rx="7.5" fill="url(#bg)"/>

  <!-- Document (knowledge base) -->
  <rect x="4.5" y="8" width="15" height="19" rx="2.5"
        fill="rgba(255,255,255,0.07)"
        stroke="rgba(255,255,255,0.88)"
        stroke-width="1.6"/>
  <rect x="7.5" y="13.5" width="9"  height="1.8" rx="0.9" fill="rgba(255,255,255,0.75)"/>
  <rect x="7.5" y="17.5" width="7"  height="1.8" rx="0.9" fill="rgba(255,255,255,0.52)"/>
  <rect x="7.5" y="21.5" width="8"  height="1.8" rx="0.9" fill="rgba(255,255,255,0.35)"/>

  <!-- Knowledge graph (RAG retrieval) — triangle of nodes top-right -->
  <line x1="23"   y1="8"    x2="28.5" y2="14"   stroke="#818cf8" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="28.5" y1="14"   x2="22"   y2="17.5"  stroke="#818cf8" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="23"   y1="8"    x2="22"   y2="17.5"  stroke="#a5b4fc" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>
  <circle cx="23"   cy="8"    r="2.4" fill="#818cf8"/>
  <circle cx="28.5" cy="14"   r="2.1" fill="#6366f1"/>
  <circle cx="22"   cy="17.5" r="1.8" fill="#a5b4fc"/>
</svg>
